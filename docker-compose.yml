version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: nutrisense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutrisense
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nutrisense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrisense -d nutrisense_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: nutrisense_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutrisense_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
